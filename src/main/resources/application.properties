spring.application.name=grand-prix-tracker

# Puerto dinámico asignado por Render (default 8080 en local)
server.port=${PORT:8080}

# ===============================================
# Configuración de Base de Datos (Supabase PostgreSQL)
# Soporta variables de entorno para Render y mantiene los defaults locales
# Modo de Transacciones (Transaction Mode via Supavisor Pooler, puerto 6543)
# ===============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.zprznayvpeijjoiknird}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:uade123uade}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# Configuración del Pool de Conexiones (HikariCP)
# Optimizado para Supabase Free Tier (Micro compute)
# Evita el agotamiento de RAM y límites de conexión del pooler
# ===============================================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:60000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.pool-name=GrandPrixTrackerHikariPool
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ===============================================
# Configuración de JPA / Hibernate
# ===============================================
# 'none' para respetar y no alterar el esquema existente en Supabase
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
# En producción los logs SQL deben estar desactivados para no saturar CPU y memoria
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===============================================
# Autenticación: JWT de Supabase Auth (OAuth2 Resource Server)
# Los tokens se firman con ES256 y las claves públicas se leen del JWKS: no hace falta ningún secreto.
# jws-algorithms es obligatorio: sin él Spring asume RS256 y rechaza todos los tokens.
# ===============================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER_URI:https://zprznayvpeijjoiknird.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWK_SET_URI:https://zprznayvpeijjoiknird.supabase.co/auth/v1/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=${SUPABASE_JWT_AUDIENCE:authenticated}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=${SUPABASE_JWT_ALGORITHMS:ES256}

# ===============================================
# Notificaciones por email (Brevo - API HTTP transaccional)
# Si BREVO_API_KEY o BREVO_SENDER_EMAIL están vacíos, no se envían emails (la compra funciona igual).
# BREVO_SENDER_EMAIL debe ser un remitente verificado en Brevo.
# ===============================================
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Grand Prix Tracker}
app.email.logo-url=${APP_EMAIL_LOGO_URL:https://raw.githubusercontent.com/ericzager0/grand-prix-tracker-api/main/src/assets/logo-nobg.png}

# ===============================================
# Microservicio de Ticketing GP (Render)
# Reserva y validación de stock en el sistema legado SOAP
# ===============================================
ticketing.microservice.url=${TICKETING_MICROSERVICE_URL:https://microservice-ticketing-gp.onrender.com/api/microservicios/tickets/reservar}
ticketing.microservice.connect-timeout-seconds=${TICKETING_CONNECT_TIMEOUT_SECONDS:15}
ticketing.microservice.read-timeout-seconds=${TICKETING_READ_TIMEOUT_SECONDS:30}

