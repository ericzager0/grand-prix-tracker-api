spring.application.name=grand-prix-tracker

# Puerto dinámico asignado por Render (default 8080 en local)
server.port=${PORT:8080}

# ===============================================
# Configuración de Base de Datos (Supabase PostgreSQL)
# Soporta variables de entorno para Render y mantiene los defaults locales
# ===============================================
# Conexión Session Pooler IPv4:
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.zprznayvpeijjoiknird}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:uade123uade}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# Configuración de JPA / Hibernate
# ===============================================
# 'none' para respetar y no alterar el esquema existente en Supabase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

